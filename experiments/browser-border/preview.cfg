MEMORY {
    HEADER: start = $07ff, size = $0002, file = %O;
    RAM: start = $0801, size = $773f, file = %O, fill = yes;
}
SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    STARTUP: load = RAM, type = ro, start = $0801;
    MATRIX: load = RAM, type = ro, start = $5c00;
    BITMAP: load = RAM, type = ro, start = $6000;
}
